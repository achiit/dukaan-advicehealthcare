<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Advice Healthcare</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#e8eff8;--tx:#10243e;--mu:#5a6b82;--pri:#0b5cad;--pri2:#0e7490;--ok:#16a34a;--warn:#b45309;--err:#c62828;--on:#fff;--sd:#c3cfdf;--sl:#fff;--chip:#d9e6f6;--hd:#e8eff8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141c28;--tx:#e6eef9;--mu:#96a6bb;--pri:#5aa4f0;--pri2:#4cc3de;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--on:#0a1626;--sd:#0b1018;--sl:#212c3e;--chip:#22324a;--hd:#141c28}}
:root[data-theme="dark"]{--bg:#141c28;--tx:#e6eef9;--mu:#96a6bb;--pri:#5aa4f0;--pri2:#4cc3de;--ok:#4ade80;--warn:#fbbf24;--err:#f87171;--on:#0a1626;--sd:#0b1018;--sl:#212c3e;--chip:#22324a;--hd:#141c28}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.5 Figtree,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
h1,h2,h3{margin:0 0 8px;line-height:1.2;font-weight:800}h1{font-size:26px}h2{font-size:20px}h3{font-size:16px}p{margin:0 0 10px;color:var(--mu)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);display:flex;gap:12px;align-items:center;justify-content:space-between;padding:10px 16px;flex-wrap:wrap}
.brand{font-weight:800;font-size:17px;color:var(--pri);display:flex;align-items:center;gap:8px}
.logo{width:34px;height:34px;border-radius:12px;background:var(--pri);color:var(--on);display:grid;place-items:center;font-weight:800}
.seg{display:flex;padding:4px;border-radius:999px;box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl)}
.seg button{border:0;background:none;color:var(--mu);font:inherit;font-weight:700;padding:6px 14px;border-radius:999px;cursor:pointer}
.seg button.on{background:var(--pri);color:var(--on)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:9;background:var(--hd);display:flex;overflow-x:auto;gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 14px var(--sd)}
nav a{flex:0 0 auto;min-width:72px;text-align:center;padding:6px 8px;border-radius:16px;color:var(--mu);text-decoration:none;font-size:11px;font-weight:700;cursor:pointer}
nav a span{display:block;font-size:19px}nav a.on{background:var(--pri);color:var(--on)}
main{padding:16px 16px 110px;max-width:1100px;margin:auto}
.raised,.card{background:var(--bg);border-radius:24px;box-shadow:8px 8px 16px var(--sd),-8px -8px 16px var(--sl)}
.card{padding:16px}.card.sm{border-radius:18px;padding:12px;box-shadow:5px 5px 10px var(--sd),-5px -5px 10px var(--sl)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;margin:16px 0}
.hero{padding:24px;display:grid;gap:20px;margin-bottom:20px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;border:0;background:var(--pri);color:var(--on);font:inherit;font-weight:700;padding:11px 20px;border-radius:999px;cursor:pointer;text-decoration:none;box-shadow:4px 4px 9px var(--sd),-4px -4px 9px var(--sl)}
.btn.ghost{background:var(--bg);color:var(--pri)}.btn.sm{padding:6px 14px;font-size:13px}.btn.red{background:var(--err);color:#fff}
.btn:focus-visible,nav a:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--pri2);outline-offset:2px}
.chip{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--chip);color:var(--pri)}
.chip.Pending,.chip.Off{color:var(--warn)}.chip.Completed,.chip.Available{color:var(--ok)}.chip.Cancelled{color:var(--err)}.chip.Progress{color:var(--pri2)}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px}
input,select,textarea{width:100%;border:0;background:var(--bg);color:var(--tx);font:inherit;padding:11px 14px;border-radius:14px;box-shadow:inset 3px 3px 6px var(--sd),inset -3px -3px 6px var(--sl)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:560px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--chip);font-size:14px}th{color:var(--mu);font-size:13px}
td select,td input{padding:6px 8px;min-width:90px}
.kpi b{display:block;font-size:28px;color:var(--pri);font-weight:800}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu)}.bars i{display:block;background:var(--pri);border-radius:10px 10px 4px 4px;margin-bottom:4px}
.meter{height:10px;border-radius:99px;box-shadow:inset 2px 2px 4px var(--sd),inset -2px -2px 4px var(--sl);margin:4px 0 12px}.meter i{display:block;height:100%;border-radius:99px;background:var(--pri2)}
.ic{font-size:30px}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;max-width:90vw}
.tog{display:flex;justify-content:space-between;align-items:center;padding:6px 0}
@media (min-width:900px){nav{top:0;right:auto;bottom:0;width:230px;flex-direction:column;padding:84px 14px 14px;box-shadow:6px 0 14px var(--sd)}nav a{text-align:left;display:flex;gap:10px;align-items:center;font-size:14px;padding:10px 14px}nav a span{font-size:18px;display:inline}main{margin-left:250px;max-width:none;padding-bottom:40px}.hero{grid-template-columns:1.3fr 1fr;align-items:center}}
@media (prefers-reduced-motion:no-preference){main>*{animation:in .25s ease-out}@keyframes in{from{opacity:.4}}}
</style></head><body><div id="app"></div>
<script>
const $m=n=>'₹'+n.toLocaleString('en-IN'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SV=[[1,'Doctor Home Visit','🩺','A qualified doctor examines, diagnoses and prescribes at home.',800,'visit'],[2,'Nursing Care','💉','Trained nurses for injections, drips, dressings and monitoring.',1200,'shift'],[3,'Senior Citizen Care','🧓','Daily assistance, medication reminders and companionship.',1500,'day'],[4,'Patient Caretaker','🤝','Attendants for bathing, feeding, mobility and hygiene.',900,'day'],[5,'Mother & Baby Care','🍼','Postnatal care, newborn bathing and feeding support.',1100,'day'],[6,'Physiotherapy','🏃','Recovery and rehabilitation sessions with a licensed therapist.',700,'session'],[7,'Nursing Procedures','🩹','Catheter, Ryle’s tube, wound care and injections.',400,'procedure'],[8,'Specialized Patient Care','🫀','ICU-style setup, ventilator and palliative support.',2200,'day'],[9,'Emergency & Medical Support','🚑','Rapid response, oxygen and ambulance coordination.',1000,'call']].map(([id,n,i,d,p,u])=>({id,n,i,d,p,u,on:true}));
const ST=[{id:1,n:'Sunita Patel',r:'Nurse',ph:'98250 11122',s:'On duty',x:'8 yrs',k:4.9},{id:2,n:'Ramesh Desai',r:'Caretaker',ph:'98790 22233',s:'Available',x:'5 yrs',k:4.7},{id:3,n:'Kavita Shah',r:'Physiotherapist',ph:'99099 33344',s:'Available',x:'6 yrs',k:4.8},{id:4,n:'Dr. Amit Mehta',r:'Doctor',ph:'98240 44455',s:'On duty',x:'12 yrs',k:4.9},{id:5,n:'Hetal Joshi',r:'Nurse',ph:'97277 55566',s:'Off',x:'4 yrs',k:4.6},{id:6,n:'Imran Sheikh',r:'Caretaker',ph:'90339 66677',s:'Available',x:'3 yrs',k:4.5}];
const CU=[['Neha Trivedi','Adajan','98250 70001'],['Bhavesh Gajera','Varachha','98791 70002'],['Priyanka Rana','Vesu','99250 70003'],['Kunal Parikh','Piplod','97120 70004'],['Meera Vaidya','Athwa','98980 70005']].map((c,i)=>({id:i+1,n:c[0],a:c[1],ph:c[2]}));
const PT=[['Jayesh Modi',72,'Post-hip-surgery recovery','Neha Trivedi'],['Savita Modi',68,'Diabetes and BP monitoring','Neha Trivedi'],['Dhruv Gajera',9,'Fracture dressing','Bhavesh Gajera'],['Lata Rana',81,'Bedridden elderly care','Priyanka Rana'],['Baby of Kunal',1,'Newborn care','Kunal Parikh'],['Ramaben Vaidya',77,'Physiotherapy after stroke','Meera Vaidya']].map((p,i)=>({id:i+1,n:p[0],age:p[1],c:p[2],o:p[3]}));
let BK=[['AHS-1041','Neha Trivedi','Jayesh Modi',6,'2026-11-02','10:00','Adajan',3,'Confirmed'],['AHS-1042','Priyanka Rana','Lata Rana',4,'2026-11-02','08:00','Vesu',2,'In Progress'],['AHS-1043','Bhavesh Gajera','Dhruv Gajera',7,'2026-11-02','16:30','Varachha',1,'Confirmed'],['AHS-1044','Kunal Parikh','Baby of Kunal',5,'2026-11-03','09:00','Piplod',1,'Confirmed'],['AHS-1045','Meera Vaidya','Ramaben Vaidya',6,'2026-11-03','11:30','Athwa',3,'Pending'],['AHS-1046','Neha Trivedi','Savita Modi',1,'2026-11-04','18:00','Adajan',4,'Confirmed'],['AHS-1047','Priyanka Rana','Lata Rana',3,'2026-11-05','08:00','Vesu',null,'Pending'],['AHS-1038','Neha Trivedi','Jayesh Modi',6,'2026-10-28','10:00','Adajan',3,'Completed'],['AHS-1035','Kunal Parikh','Baby of Kunal',5,'2026-10-24','09:00','Piplod',1,'Completed'],['AHS-1031','Bhavesh Gajera','Dhruv Gajera',7,'2026-10-20','17:00','Varachha',5,'Cancelled']].map(b=>({id:b[0],cu:b[1],pt:b[2],sv:b[3],d:b[4],t:b[5],ar:b[6],st:b[7],s:b[8],amt:SV[b[3]-1].p*(b[3]==3||b[3]==4?3:1),n:'',done:[]}));
const AREAS=['Adajan','Vesu','Piplod','Varachha','Katargam','Athwa','Althan','Pal'];
const NAV={c:[['home','Home','🏠'],['services','Services','🩺'],['book','Book Now','📅'],['bookings','My Bookings','📋'],['profile','Profile','👤'],['contact','Contact','☎️']],a:[['dashboard','Dashboard','📊'],['bookings','Bookings','📋'],['patients','Patients','🧑‍⚕️'],['customers','Customers','👥'],['staff','Staff','🧑‍⚕️'],['services','Services','🧰'],['pricing','Pricing','₹'],['reports','Reports','📈'],['settings','Settings','⚙️']],s:[['tasks','My Assigned Tasks','✅'],['visit','Patient Visit Details','🩺'],['schedule','Schedule','🗓️'],['profile','Profile','👤']]};
const ME='Neha Trivedi',STAFF=1;let preSv=1,visit='AHS-1041',filt='All',toast='';
const sv=id=>SV.find(s=>s.id==id),sn=id=>ST.find(s=>s.id==id)?.n||'Unassigned',chip=s=>`<span class="chip ${s.split(' ')[0]}">${s}</span>`;
const bkRow=(b,x='')=>`<tr><td>${b.id}</td><td>${esc(b.pt)}</td><td>${sv(b.sv).n}</td><td>${b.d} · ${b.t}</td><td>${chip(b.s)}</td>${x}</tr>`;
const stf=(sel,id)=>`<select data-ch="assign:${id}"><option value="">Unassigned</option>${ST.map(s=>`<option value="${s.id}" ${s.id==sel?'selected':''}>${s.n}</option>`).join('')}</select>`;
const tbl=(h,r)=>`<div class="card scroll"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${r}</table></div>`;
const svCard=s=>`<div class="card"><div class="ic">${s.i}</div><h3>${s.n}</h3><p>${s.d}</p><div class="row" style="justify-content:space-between"><b>${$m(s.p)} / ${s.u}</b><button class="btn sm" data-a="book:${s.id}">Book</button></div></div>`;
const kpi=(l,v)=>`<div class="card kpi"><p>${l}</p><b>${v}</b></div>`;
const P={c:{
home:()=>`<section class="hero raised"><div><h1>Professional nursing care, at your door in Surat</h1><p>Doctors, nurses and caretakers for your family, booked in two minutes and confirmed on WhatsApp.</p><div class="row"><button class="btn" data-a="go:c-book">Book a visit</button><a class="btn ghost" href="https://wa.me/918866775585">WhatsApp us</a></div></div><div class="two"><div class="card sm kpi"><b>2,400+</b><p>Home visits completed</p></div><div class="card sm kpi"><b>4.8</b><p>Average family rating</p></div><div class="card sm kpi"><b>60 min</b><p>Typical response time</p></div><div class="card sm kpi"><b>24×7</b><p>Emergency support</p></div></div></section><h2>Popular services</h2><div class="grid">${SV.filter(s=>s.on).slice(0,6).map(svCard).join('')}</div><button class="btn ghost" data-a="go:c-services">See all services</button>`,
services:()=>`<h2>Our services</h2><p>Every visit is by a verified, trained professional.</p><div class="grid">${SV.filter(s=>s.on).map(svCard).join('')}</div>`,
book:()=>`<h2>Book a home visit</h2><form class="card" data-f="book" data-est><label>Service</label><select name="sv">${SV.filter(s=>s.on).map(s=>`<option value="${s.id}" ${s.id==preSv?'selected':''}>${s.n} — ${$m(s.p)}/${s.u}</option>`).join('')}</select><div class="two"><div><label>Patient name</label><input name="pt" required></div><div><label>Age</label><input name="age" type="number" min="0" max="120" required></div><div><label>Date</label><input name="d" type="date" min="2026-11-02" value="2026-11-03" required></div><div><label>Time</label><select name="t">${['08:00','10:00','12:00','16:00','18:00'].map(t=>`<option>${t}</option>`).join('')}</select></div></div><label>Area in Surat</label><select name="ar">${AREAS.map(a=>`<option>${a}</option>`).join('')}</select><label>Address and notes</label><textarea name="n" rows="3" placeholder="Flat, society, landmark, and anything we should know"></textarea><p id="est" style="margin-top:12px"></p><button class="btn">Request booking</button></form>`,
bookings:()=>{const l=BK.filter(b=>b.cu==ME);return`<h2>My bookings</h2>${l.length?l.map(b=>`<div class="card" style="margin:14px 0"><div class="row" style="justify-content:space-between"><h3>${sv(b.sv).n}</h3>${chip(b.s)}</div><p>${b.id} · ${esc(b.pt)} · ${b.d} at ${b.t}, ${b.ar}</p><p>Caregiver: ${sn(b.s)} · ${$m(b.amt)}</p>${['Pending','Confirmed'].includes(b.st)?`<button class="btn sm red" data-a="cancel:${b.id}">Cancel booking</button>`:''}</div>`).join(''):'<p>No bookings yet. Book your first visit.</p>'}`},
profile:()=>`<h2>Profile</h2><div class="card"><div class="two"><div><label>Name</label><input value="Neha Trivedi"></div><div><label>Phone</label><input value="+91 98250 70001"></div></div><label>Address</label><input value="Adajan, Surat, Gujarat"><button class="btn" style="margin-top:14px" data-a="toast:Profile saved">Save changes</button></div><h3 style="margin-top:20px">Saved patients</h3><div class="grid">${PT.filter(p=>p.o==ME).map(p=>`<div class="card sm"><b>${p.n}</b><p>${p.age} yrs · ${p.c}</p></div>`).join('')}</div>`,
contact:()=>`<h2>Contact us</h2><div class="grid"><div class="card"><h3>Advice Healthcare Services</h3><p>Surat, Gujarat, India</p><p>📞 <a href="tel:+918866775585">+91 88667 75585</a><br>✉️ <a href="mailto:advicehomecare@gmail.com">advicehomecare@gmail.com</a></p><a class="btn" href="https://wa.me/918866775585">Chat on WhatsApp</a></div><form class="card" data-f="msg"><label>Your name</label><input required><label>Message</label><textarea rows="4" required></textarea><button class="btn" style="margin-top:12px">Send message</button></form></div>`},
a:{
dashboard:()=>{const rev=BK.filter(b=>b.st=='Completed').reduce((a,b)=>a+b.amt,0);return`<h2>Dashboard</h2><div class="grid">${kpi('Visits today',BK.filter(b=>b.d=='2026-11-02'&&b.st!='Cancelled').length)}${kpi('Pending requests',BK.filter(b=>b.st=='Pending').length)}${kpi('Staff on duty',ST.filter(s=>s.s=='On duty').length+' / '+ST.length)}${kpi('Revenue (completed)',$m(rev))}</div><div class="card"><h3>Bookings this week</h3><div class="bars">${[['Mon',6],['Tue',9],['Wed',7],['Thu',11],['Fri',8],['Sat',12],['Sun',4]].map(([d,v])=>`<div><i style="height:${v*11}px"></i>${d}</div>`).join('')}</div></div><h3 style="margin-top:20px">Latest bookings</h3>${tbl(['ID','Patient','Service','When','Status'],BK.slice(0,5).map(b=>bkRow(b)).join(''))}`},
bookings:()=>`<h2>Bookings</h2><div class="row" style="margin-bottom:12px">${['All','Pending','Confirmed','In Progress','Completed','Cancelled'].map(f=>`<button class="btn sm ${f==filt?'':'ghost'}" data-a="filt:${f}">${f}</button>`).join('')}</div>${tbl(['ID','Customer','Service','When','Assigned','Status'],BK.filter(b=>filt=='All'||b.st==filt).map(b=>`<tr><td>${b.id}</td><td>${b.cu}</td><td>${sv(b.sv).n}</td><td>${b.d} · ${b.t}</td><td>${stf(b.s,b.id)}</td><td><select data-ch="status:${b.id}">${['Pending','Confirmed','In Progress','Completed','Cancelled'].map(s=>`<option ${s==b.st?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join(''))}`,
patients:()=>`<h2>Patients</h2>${tbl(['Name','Age','Care need','Booked by'],PT.map(p=>`<tr><td>${p.n}</td><td>${p.age}</td><td>${p.c}</td><td>${p.o}</td></tr>`).join(''))}`,
customers:()=>`<h2>Customers</h2>${tbl(['Name','Phone','Area','Bookings'],CU.map(c=>`<tr><td>${c.n}</td><td>${c.ph}</td><td>${c.a}</td><td>${BK.filter(b=>b.cu==c.n).length}</td></tr>`).join(''))}`,
staff:()=>`<h2>Staff</h2><div class="grid">${ST.map(s=>`<div class="card"><h3>${s.n}</h3><p>${s.r} · ${s.x} experience</p><p>📞 ${s.ph} · ⭐ ${s.k}</p>${chip(s.s)} <button class="btn sm ghost" data-a="rot:${s.id}">Change status</button></div>`).join('')}</div>`,
services:()=>`<h2>Services</h2><div class="card">${SV.map(s=>`<div class="tog"><span>${s.i} ${s.n}</span><button class="btn sm ${s.on?'':'ghost'}" data-a="tog:${s.id}">${s.on?'Active':'Hidden'}</button></div>`).join('')}</div>`,
pricing:()=>`<h2>Pricing</h2><p>Changes apply to new bookings on the customer portal.</p>${tbl(['Service','Unit','Price (₹)'],SV.map(s=>`<tr><td>${s.i} ${s.n}</td><td>per ${s.u}</td><td><input type="number" value="${s.p}" data-ch="price:${s.id}"></td></tr>`).join(''))}`,
reports:()=>{const t={};BK.filter(b=>b.st!='Cancelled').forEach(b=>t[sv(b.sv).n]=(t[sv(b.sv).n]||0)+b.amt);const m=Math.max(...Object.values(t));return`<h2>Reports</h2><div class="card"><h3>Revenue by service</h3>${Object.entries(t).map(([k,v])=>`<div class="row" style="justify-content:space-between"><span>${k}</span><b>${$m(v)}</b></div><div class="meter"><i style="width:${v/m*100}%"></i></div>`).join('')}</div><div class="grid">${['Pending','Confirmed','In Progress','Completed','Cancelled'].map(s=>kpi(s,BK.filter(b=>b.st==s).length)).join('')}</div>`},
settings:()=>`<h2>Settings</h2><form class="card" data-f="set"><label>Business name</label><input value="Advice Healthcare Services"><div class="two"><div><label>Phone / WhatsApp</label><input value="+91 88667 75585"></div><div><label>Email</label><input value="advicehomecare@gmail.com"></div></div><label>Location</label><input value="Surat, Gujarat, India"><div class="tog" style="margin-top:12px"><span>WhatsApp booking alerts</span><input type="checkbox" checked style="width:22px"></div><div class="tog"><span>Email daily summary</span><input type="checkbox" style="width:22px"></div><button class="btn">Save settings</button></form>`},
s:{
tasks:()=>{const l=BK.filter(b=>b.s==STAFF&&b.st!='Cancelled');return`<h2>My assigned tasks</h2>${l.map(b=>`<div class="card" style="margin:14px 0"><div class="row" style="justify-content:space-between"><h3>${sv(b.sv).n}</h3>${chip(b.st)}</div><p>${esc(b.pt)} · ${b.d} at ${b.t} · ${b.ar}</p><div class="row"><button class="btn sm" data-a="open:${b.id}">Visit details</button>${b.st=='Confirmed'?`<button class="btn sm ghost" data-a="start:${b.id}">Start visit</button>`:''}</div></div>`).join('')}`},
visit:()=>{const b=BK.find(x=>x.id==visit),p=PT.find(x=>x.n==b.pt);const ck=['Hand hygiene and identity check','Vitals recorded','Care task completed','Family briefed'];return`<h2>Patient visit details</h2><div class="card"><h3>${esc(b.pt)} ${p?`· ${p.age} yrs`:''}</h3><p>${p?p.c:''}</p><p>${sv(b.sv).n} · ${b.d} at ${b.t} · ${b.ar}</p>${chip(b.st)}<div class="two"><div><label>BP (mmHg)</label><input placeholder="120/80"></div><div><label>Pulse (bpm)</label><input type="number" placeholder="76"></div></div><label>Visit checklist</label>${ck.map(c=>`<div class="tog"><span>${c}</span><input type="checkbox" style="width:22px"></div>`).join('')}<label>Visit notes</label><textarea rows="3" data-ch="note:${b.id}">${esc(b.n)}</textarea><div class="row" style="margin-top:14px"><button class="btn" data-a="done:${b.id}">Complete visit</button></div></div>`},
schedule:()=>`<h2>Schedule</h2>${tbl(['ID','Patient','Service','When','Status'],BK.filter(b=>b.s==STAFF).sort((a,b)=>a.d>b.d?1:-1).map(b=>bkRow(b)).join(''))}`,
profile:()=>`<h2>Profile</h2><div class="card"><h3>Sunita Patel</h3><p>Nurse · 8 years experience · ⭐ 4.9</p><p>📞 98250 11122 · Areas: Adajan, Vesu, Piplod</p><button class="btn ghost" data-a="rot:1">Change availability</button> ${chip(ST[0].s)}</div>`}};
function render(){let[r,...p]=location.hash.slice(1).split('-');if(!NAV[r])r='c';let pg=p.join('-');if(!NAV[r].some(n=>n[0]==pg))pg=NAV[r][0][0];
const lab={c:'Customer',a:'Admin',s:'Staff'};
document.getElementById('app').innerHTML=`<header><div class="brand"><span class="logo">+</span>Advice Healthcare</div><div class="seg">${['c','a','s'].map(k=>`<button class="${k==r?'on':''}" data-a="go:${k}-${NAV[k][0][0]}">${lab[k]}</button>`).join('')}</div></header><nav>${NAV[r].map(n=>`<a tabindex="0" class="${n[0]==pg?'on':''}" data-a="go:${r}-${n[0]}"><span>${n[2]}</span>${n[1]}</a>`).join('')}</nav><main>${P[r][pg]()}</main>${toast?`<div class="toast">${toast}</div>`:''}`;est()}
function est(){const f=document.querySelector('[data-est]'),e=document.getElementById('est');if(f&&e){const s=sv(f.sv.value);e.textContent=`Estimated charge: ${$m(s.p)} per ${s.u}. Final amount is confirmed on WhatsApp.`}}
function say(m){toast=m;render();setTimeout(()=>{toast='';render()},2200)}
const go=h=>{location.hash=h;scrollTo(0,0)};
const A={go,toast:say,book:v=>{preSv=+v;go('c-book')},cancel:v=>{BK.find(b=>b.id==v).st='Cancelled';say('Booking cancelled')},filt:v=>{filt=v;render()},tog:v=>{const s=sv(v);s.on=!s.on;render()},rot:v=>{const s=ST.find(x=>x.id==v),o=['Available','On duty','Off'];s.s=o[(o.indexOf(s.s)+1)%3];render()},open:v=>{visit=v;go('s-visit')},start:v=>{BK.find(b=>b.id==v).st='In Progress';say('Visit started')},done:v=>{BK.find(b=>b.id==v).st='Completed';say('Visit marked complete');go('s-tasks')}};
const C={assign:(v,e)=>{BK.find(b=>b.id==v).s=+e.value||null;say('Caregiver updated')},status:(v,e)=>{BK.find(b=>b.id==v).st=e.value;say('Status updated')},price:(v,e)=>{sv(v).p=+e.value;say('Price saved')},note:(v,e)=>{BK.find(b=>b.id==v).n=e.value}};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(t){const i=t.dataset.a.indexOf(':');A[t.dataset.a.slice(0,i)](t.dataset.a.slice(i+1),t)}});
document.addEventListener('change',e=>{const t=e.target.closest('[data-ch]');if(t){const[k,v]=t.dataset.ch.split(':');C[k](v,t)}if(e.target.closest('[data-est]'))est()});
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target,k=f.dataset.f;if(k=='book'){const d=Object.fromEntries(new FormData(f)),s=sv(d.sv);BK.unshift({id:'AHS-'+(1048+BK.length),cu:ME,pt:d.pt,sv:+d.sv,d:d.d,t:d.t,ar:d.ar,s:null,st:'Pending',amt:s.p,n:'',done:[]});go('c-bookings');say('Booking requested. We’ll confirm on WhatsApp shortly.')}else say(k=='msg'?'Message sent. We’ll reply soon.':'Settings saved')});
addEventListener('hashchange',render);render();
</script></body></html>
